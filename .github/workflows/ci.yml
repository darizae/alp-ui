name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tested Qt and development tools
        run: python -m pip install -e ".[dev]" "PySide6-Essentials==6.11.2"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Record artifact SHA-256
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          $hashes = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          $hashes | Set-Content -Path dist/SHA256SUMS -Encoding utf8
          $hashes | ForEach-Object { Write-Output $_ }
      - name: Retain tested release-candidate distributions
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: alp-ui-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
